[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cascad-ai"
version = "0.1.0"
description = "Automatic scoring system for Cascadia board game from photographs"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "matplotlib",
    "networkx"
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cascadai*"]